<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Theme – vor CSS setzen um FOUC zu vermeiden -->
  <script>(function(){try{var t=localStorage.getItem("sylva-theme");var e=t==="dark"||t==="light"?t:(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",e);document.documentElement.style.colorScheme=e;}catch{}})();</script>

  <title>Zuhause - Lern doch noch etwas</title>

  <!-- Loading Screen CSS – SOFORT laden -->
  <link rel="stylesheet" href="./Code/loading-screen/loading-screen.css">

  <!-- Haupt-CSS -->
  <link rel="stylesheet" href="./Code/home/frontend/style.css">

  <meta name="version" content="v1.0.6 beta">
</head>

<body>

<!-- ========================================
     LOADING SCREEN
========================================= -->

<sylva-loading></sylva-loading>

<script src="./Code/loading-screen/loading-screen.js" defer></script>


<!-- ========================================
     HAUPTINHALT
========================================= -->

<div class="container">

  <!-- HEADER -->
  <div class="header">

    <div class="logo">
      📖SylvaLearn
    </div>

    <div class="streak">
      🔥 <span id="streak">0</span> Streak
    </div>

  </div>


  <!-- GREETING -->
  <div class="card">

    <h2>
      Hallo <span id="name">Lernender</span>! 👋
    </h2>

    <p>
      Bereit, heute etwas zu lernen?
    </p>

    <div class="progress-bar">
      <div class="progress" id="bar"></div>
    </div>

    <p>
      <strong>
        <span id="timer"></span>
        /
        <span id="maxMinutes"></span>
      </strong>
    </p>

  </div>


  <!-- WEITERLERNEN -->
  <h3 style="margin-top: 25px;">
    Lernsets üben
  </h3>

  <div class="card">

    <div
      class="grid"
      id="learnsetListLearn">
    </div>

  </div>


  <!-- LERNSETS BEARBEITEN -->
  <h3 style="margin-top: 25px;">
    Lernsets bearbeiten
  </h3>

  <div class="card">

    <div
      class="grid"
      id="learnsetListEdit">
    </div>

  </div>


  <!-- HOW IT WORKS -->
  <h3 style="margin-top: 25px;">
    So funktioniert es
  </h3>

  <div class="card">

    <div class="grid">

      <div class="small-card">
        1️⃣<br>
        Karte ansehen
      </div>

      <div class="small-card">
        2️⃣<br>
        Antwort geben
      </div>

      <div class="small-card">
        3️⃣<br>
        Selbsteinschätzung
      </div>

    </div>

    <div
      class="button"
      style="margin-top: 10px;"
      onclick="location.href='./Code/cards/cards.html'">

      + Neues Lernset erstellen

    </div>

  </div>

</div>


<!-- ========================================
     NAVIGATION
========================================= -->

<script src="./Code/app-nav.js" defer></script>

<app-nav></app-nav>


<!-- ========================================
     SEITENSCRIPTS
========================================= -->

<script src="./Code/theme/theme.js" defer></script>

<script src="./Code/home/frontend/uiTime.js" defer></script>

<script src="./Code/home/frontend/streak.js" defer></script>

<script src="./Code/home/frontend/setsRenderHome.js" defer></script>

</body>
</html>

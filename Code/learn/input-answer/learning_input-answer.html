<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Theme – vor CSS setzen um FOUC zu vermeiden -->
  <script>(function(){try{var t=localStorage.getItem("sylva-theme");var e=t==="dark"||t==="light"?t:(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",e);document.documentElement.style.colorScheme=e;}catch{}})();</script>

  <title>Lernset Editor</title>

  <!-- LOADING SCREEN -->
  <link rel="stylesheet" href="../../loading-screen/loading-screen.css">

  <!-- CSS FIX -->
  <link rel="stylesheet" href="../../home/frontend/style.css">

  <style>
    /* Nach der Auswertung wird das Eingabefeld durch statischen Text ersetzt. */
    #userAnswerStatic {
      flex: 1;
      width: 100%;
      padding: 18px 20px;
      border: 2px solid transparent;
      border-radius: 22px;
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      background: transparent;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #userAnswerStatic[hidden],
    #userAnswer[hidden] {
      display: none;
    }

    #mistakeActions {
      margin-top: 10px;
    }

    #mistakeActions[hidden] {
      display: none;
    }

    #showMistakesBtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border: 1px solid var(--evaluation-border, #dbe5de);
      border-radius: 999px;
      background: var(--small-card-bg, #fff);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition, 0.2s), border-color var(--transition, 0.2s);
    }

    #showMistakesBtn:hover {
      border-color: rgba(209, 26, 42, 0.35);
      background: rgba(209, 26, 42, 0.06);
    }

    #userAnswerStatic .wrong-letter {
      color: #d11a2a;
      background: rgba(209, 26, 42, 0.12);
      border-radius: 3px;
      padding: 0 1px;
      font-weight: 700;
    }

    #userAnswerStatic .missing-letter {
      color: #d11a2a;
      font-weight: 800;
      opacity: 0.75;
    }

    [data-theme="dark"] #userAnswerStatic .wrong-letter {
      color: #ff7b7b;
      background: rgba(255, 123, 123, 0.16);
    }

    [data-theme="dark"] #userAnswerStatic .missing-letter {
      color: #ff7b7b;
    }
  </style>
</head>

<body>

<!-- LOADING SCREEN -->
<sylva-loading></sylva-loading>
<script src="../../loading-screen/loading-screen.js" defer></script>

<body>

    <div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">Lernen</div>
    <div class="streak">📊 <span id="finishedCardsText">0 / 0</span></div>
  </div>

  <!-- PROGRESS -->
  <div class="card">
    <div class="progress-bar">
      <div id="finishedCardsBar" class="progress" style="width:0%"></div>
    </div>
  </div>

  <!-- KARTE -->
  <div class="card" id="flashcard">

    <div class="topbar">
      <h2 id="question">Frage</h2>

      <div id="reverseBtnWrapper" class="mode-switch">
        <button class="mode active" id="reverseBtn">
          Reverse
        </button>
      </div>
    </div>

    <div class="answer-row" style="display: flex; align-items: center; gap: 10px;">

      <input id="userAnswer" placeholder="Deine Antwort" style="flex: 1;">

      <div id="userAnswerStatic" hidden aria-label="Deine Antwort"></div>

      <div id="compareModeBtns" class="mode-switch" style="display: flex; gap: 5px">
        <button class="mode" id="smartBtn">
          Smart
        </button>

        <button class="mode" id="strictBtn">
          Strict
        </button>
      </div>

    </div>

    <h5 id="evaluation" style="display:none; margin-top:15px; margin-bottom: 1px;"></h5>

    <div id="mistakeActions" hidden>
      <button
        id="showMistakesBtn"
        type="button"
        aria-expanded="false"
        title="Falsche Buchstaben deiner Antwort rot markieren"
      >
        Fehler anzeigen
      </button>
    </div>
  </div>

  <!-- CONFIDENCE -->
  <div class="card" id="confidenceBox">
    <h3>Wie sicher bist du?</h3>

    <div class="confidence-buttons">
      <button class="button" data-level="5">❌ Geraten</button>
      <button class="button" data-level="4">👎 Unsicher</button>
      <button class="button" data-level="3">😐 Vielleicht</button>
      <button class="button" data-level="2">👍 Sicher</button>
      <button class="button" data-level="1">✅ Sehr sicher</button>
    </div>
  </div>


  <!-- AKTIONEN -->
  <div class="card" id="nextBtn">

    <button id="nextBtnButton" class="button" style="margin-top:10px; display:block;">
      Nächste Karte
    </button>

  </div>

</div>

<!-- NAV -->
  <script src="../../theme/theme.js" defer></script>

  <script src="../../app-nav.js" defer></script>
<app-nav></app-nav>

<!-- SCRIPT -->
<!-- Service Worker auch auf dieser Unterseite aktualisieren. -->
<script src="../../../app.js" defer></script>

<!-- Versions-Query: erzwingt nach Updates frische ES-Module statt alter HTTP-Caches. -->
<script type="module" src="./answer-compare-mode-controller.js?v=20261105f" defer></script>
<script src="../../home/frontend/countingTime.js" defer></script>

</body>
</html>

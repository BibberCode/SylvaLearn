<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil</title>

<link rel="stylesheet" href="../home/frontend/style.css">

</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">Profil</div>
  </div>

  <!-- PROFIL CARD -->
  <div class="card profile-card">

    <button class="avatar" onclick="document.getElementById('fileInput').click()">
      <img id="avatarImg" alt="Profilbild" src="../home/frontend/avatar-placeholder.png">
    </button>
    <input type="file" id="fileInput" accept="image/*" hidden>

    <h2 id="name">"[Name]"</h2>
    <p class="subtext">Lernender</p>

    <div class="progress-bar">
      <div class="progress" id="bar"></div>
    </div>

    <p><strong><span id="timer"></span> / <span id="maxMinutes"></span> min</strong></p>

    <input id="nameInput" placeholder="Name ändern">
    <div class="button" onclick="saveName()" style="margin-top: 10px;">Name ändern</div>

    <input id="maxMinutesInput" placeholder="Lernzeit festlegen" style="margin-top: 30px;">
    <div class="button" onclick="setMaxMinutes()" style="margin-top: 10px;">Lernzeit festlegen</div>
  </div>

  <!-- STATS -->
  <div class="card">
    📊
    <h3>Statistik</h3>

    <div class="grid">
      <div class="small-card">
        <h4>🔥 <span id="streak">0</span></h4>
        <p>Streak</p>
      </div>

      <div class="small-card">
        <h4 id="numberOfSets">0</h4>
        <p>Lernsets</p>
      </div>

      <div class="small-card">
        <h4>84%</h4>
        <p>Durchschnitt</p>
      </div>

      <div class="small-card">
        <h4 id="totalTime">0 min</h4>
        <p>Gesamtzeit</p>
      </div>
    </div>
  </div>

  <!-- SUPPORT / FEEDBACK -->
  <div class="card">

    <h3>Support</h3>
    <p class="small-text">
      Wenn du Fehler findest oder Ideen hast, kannst du sie hier melden.
    </p>

    <div class="button" onclick="location.href='./feedback.html'">
      Feedback & Bugs melden
    </div>

  </div>

  

</div>

<!-- NAV -->
<script src="../app-nav.js" defer></script>
<app-nav></app-nav>

<!-- SCRIPTS -->
<script src="../profile/profile-script.js"></script>
<script src="../home/frontend/uiTime.js"></script>
<script src="../home/frontend/streak.js" defer></script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Theme – vor CSS setzen um FOUC zu vermeiden -->
  <script>(function(){try{var t=localStorage.getItem("sylva-theme");var e=t==="dark"||t==="light"?t:(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",e);document.documentElement.style.colorScheme=e;}catch{}})();</script>

  <title>Karten</title>

  <!-- Loading Screen CSS -->
  <link rel="stylesheet" href="../loading-screen/loading-screen.css">

  <!-- Normales CSS -->
  <link rel="stylesheet" href="../home/frontend/style.css">

  <!-- DATENVERWALTUNG (Export-Button) -->
  <link rel="stylesheet" href="../data/import-export/import-export.css">

  <!-- Loading Screen JS -->
  <script src="../loading-screen/loading-screen.js" defer></script>
</head>

<body>

  <!-- LOADING SCREEN – MUSS DIREKT NACH BODY KOMMEN -->
  <sylva-loading></sylva-loading>

  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <div class="logo">LernSets</div>

      <div class="streak">
        🔥 <span id="streak">0</span> Streak
      </div>
    </div>


    <!-- NEUES LERNSET -->
    <div class="card">

      <h3>Neues Lernset erstellen</h3>

      <input
        id="title"
        type="text"
        placeholder="Titel eingeben"
      >

      <input
        id="description"
        type="text"
        style="margin-top: 10px"
        placeholder="Beschreibung (optional)"
      >

      <button
        style="margin-top: 12px;"
        class="button"
        onclick="addLearnset()"
      >
        Erstellen
      </button>

    </div>


    <!-- LERNSETS ÜBERSICHT -->
    <div class="card">

      <h3>Deine Lernsets bearbeiten</h3>

      <div
        class="grid"
        id="learnsetList"
      ></div>

    </div>


    <!-- LERNSETS IMPORTIEREN -->
    <div class="card">

      <h3>📥 Lernsets importieren</h3>

      <p class="small-text">
        Markdown (.md) oder Backup (.json).
        Dateien werden erst geprüft –
        du bestätigst den Import in einer Vorschau.
      </p>

      <input
        type="file"
        id="importInput"
        accept=".md,.markdown,.json"
        multiple
        hidden>

      <div
        class="sylva-dropzone"
        id="importDropzone"
        role="button"
        tabindex="0"
        aria-label="Dateien zum Importieren auswählen oder hierher ziehen">
        <strong>Dateien wählen oder hierher ziehen</strong><br>
        .md oder .json – mehrere Dateien möglich
      </div>

      <div
        class="sylva-status"
        id="importStatus"
        role="status"
        aria-live="polite">
      </div>

    </div>

  </div>


  <!-- IMPORT-VORSCHAU -->
  <div
    class="sylva-modal-overlay hidden"
    id="importModal"
    aria-hidden="true">

    <div
      class="sylva-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="importTitle">

      <header>
        <h3 id="importTitle">Import</h3>
        <p
          class="sylva-modal-summary"
          id="importSummary">
        </p>
        <p
          class="sylva-modal-summary"
          id="importSubSummary">
        </p>
      </header>

      <div class="sylva-modal-body">
        <div id="importFileErrors"></div>
        <div id="importBackupDetails"></div>
        <div id="importItems"></div>

        <label
          class="sylva-checkline"
          id="backupMetaBox"
          style="display: none;">
          <input
            type="checkbox"
            id="restoreMetaCheck"
            checked>
          <span>
            Einstellungen, Lernzeit und
            Statistiken aus dem Backup
            wiederherstellen
          </span>
        </label>

        <p
          class="sylva-preview-warning"
          id="importHint"
          style="display: none;"
          role="status">
        </p>
      </div>

      <footer>
        <button
          class="button-secondary"
          id="importCancelBtn"
          type="button">
          Abbrechen
        </button>

        <button
          class="button"
          id="importConfirmBtn"
          type="button">
          Importieren
        </button>
      </footer>

    </div>

  </div>


  <!-- NAVIGATION -->
    <script src="../theme/theme.js" defer></script>

  <script src="../app-nav.js" defer></script>

  <app-nav></app-nav>


  <!-- SCRIPTS -->
  <script src="../shared/name-filter.js" defer></script>
  <script src="../home/frontend/countingTime.js" defer></script>
  <script src="../home/frontend/streak.js" defer></script>

  <script src="../data/import-export/migrations.js" defer></script>
  <script src="../data/import-export/validator.js" defer></script>
  <script src="../data/import-export/markdown.js" defer></script>
  <script src="../data/import-export/json.js" defer></script>
  <script src="../data/import-export/exporter.js" defer></script>
  <script src="../data/import-export/importer.js" defer></script>

  <script src="./learnsets.js" defer></script>
  <script src="../data/import-export/data-manager.js" defer></script>

</body>
</html>
